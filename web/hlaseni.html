<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hlášení – 3D Stodsko</title>
  <meta name="description" content="Přehled nahlášených chyb a změn v mapě 3D Stodsko.">
  <style>
    :root {
      --bg: #f4f1ea; --card: #ffffff; --text: #1f2421; --muted: #6b6f68; --line: #e2ddd2;
      --accent: #c9832e; --ok: #2f7d4a; --chip: #efe9dc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b201d; --card: #252b27; --text: #eeebe3; --muted: #a7a99f; --line: #36403a; --chip: #313a34; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); }
    header { max-width: 820px; margin: 0 auto; padding: 28px 16px 8px; }
    h1 { margin: 0; font-size: 26px; }
    h1 span { color: var(--accent); }
    header p { color: var(--muted); margin: 6px 0 0; }
    header a { color: var(--accent); }
    .bar { max-width: 820px; margin: 14px auto 0; padding: 0 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    .bar button {
      font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text);
      padding: 6px 12px; border-radius: 999px; cursor: pointer;
    }
    .bar button.active { background: var(--accent); border-color: var(--accent); color: #1b1a17; font-weight: 600; }
    main { max-width: 820px; margin: 0 auto; padding: 12px 16px 40px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .id { color: var(--muted); font-variant-numeric: tabular-nums; }
    .type { background: var(--chip); padding: 2px 8px; border-radius: 999px; font-size: 13px; }
    .status { font-size: 12px; color: var(--muted); margin-left: auto; }
    .status.vyreseno { color: var(--ok); font-weight: 600; }
    .text { margin: 8px 0; white-space: pre-wrap; line-height: 1.5; }
    .meta { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .meta a { color: var(--accent); }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  </style>
  <!-- návštěvnost (GoatCounter na VPS, stejné jako blog; bez cookies). Cesta s doménou, ať se 3D mapa
       v přehledu odliší od stránek blogu. -->
  <script>window.goatcounter = { path: (p) => location.host + location.pathname };</script>
  <script data-goatcounter="https://navstevnost.ok1sim.cz/count" async src="https://navstevnost.ok1sim.cz/count.js"></script>
</head>
<body>
  <header>
    <h1><span>3D</span> Stodsko – hlášení</h1>
    <p>Nahlášené chyby a změny v mapě, nejnovější nahoře. <a href="./">← Zpět na mapu</a></p>
  </header>
  <div class="bar" id="filters"></div>
  <main id="list"><div class="empty">Načítám…</div></main>

  <script>
    const TYPES = { chyba: 'Chyba v mapě', chybi: 'Chybějící místo / objekt', zmena: 'Změna v terénu / stavba', jine: 'Jiné' };
    const list = document.getElementById('list');
    const filters = document.getElementById('filters');
    let all = [], filter = '';

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function render() {
      list.replaceChildren();
      const items = all.filter((r) => !filter || r.type === filter);
      if (!items.length) { list.append(el('div', 'empty', all.length ? 'V této kategorii nic není.' : 'Zatím žádná hlášení.')); return; }
      for (const r of items) {
        const c = el('article', 'card');
        const top = el('div', 'top');
        top.append(el('span', 'id', `#${r.id}`), el('span', 'type', TYPES[r.type] || r.type),
          el('span', `status ${r.status === 'vyřešeno' ? 'vyreseno' : ''}`, r.status || 'nové'));
        c.append(top, el('p', 'text', r.text));
        const meta = el('div', 'meta');
        const when = new Date(r.time);
        meta.append(el('span', '', isNaN(when) ? r.time : when.toLocaleString('cs-CZ', { dateStyle: 'medium', timeStyle: 'short' })));
        if (r.place) meta.append(el('span', '', `📍 ${r.place}`));
        if (r.name) meta.append(el('span', '', `Nahlásil(a): ${r.name}`));
        if (r.view) {
          const a = el('a', '', 'Zobrazit na mapě');
          a.href = (r.x != null ? `./?mark=${r.x},${r.z},${r.id}` : './') + `#${r.view}`;
          meta.append(a);
        }
        c.append(meta);
        list.append(c);
      }
    }
    function renderFilters() {
      filters.replaceChildren();
      for (const [k, name] of [['', 'Vše'], ...Object.entries(TYPES)]) {
        const n = k ? all.filter((r) => r.type === k).length : all.length;
        const b = el('button', k === filter ? 'active' : '', `${name} (${n})`);
        b.onclick = () => { filter = k; renderFilters(); render(); };
        filters.append(b);
      }
    }
    async function load() {
      try {
        const r = await fetch('api/reports', { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        all = await r.json();
        renderFilters();
        render();
      } catch {
        list.replaceChildren(el('div', 'empty', 'Hlášení se nepodařilo načíst – server s hlášeními neběží.'));
      }
    }
    load();
    setInterval(load, 60000);   // nová hlášení se objeví sama
  </script>
</body>
</html>
